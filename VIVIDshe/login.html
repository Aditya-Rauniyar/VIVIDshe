<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile</title>
    <link rel="stylesheet" href="login.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
</head>
<body>
    <div id="wrapper">
        <div class="container">
            <div class="form-container">
                <div class="Home">
                    <i class="ri-home-2-fill"></i>
                </div>
                <div class="Home">
                    <a href="http://127.0.0.1:5500/index.html" class="box1">HOME</a>
                </div>
                <h1>Create Profile</h1>
                <form action="#" method="post">
                    <div class="textbox">
                        <input type="text" placeholder="Username" name="username" required>
                    </div>

                    <div class="textbox">
                        <input type="password" placeholder="Password" name="password" required>
                    </div>

                    <div class="textbox">
                        <input type="email" placeholder="Email" name="email" required>
                    </div>

                    <div class="textbox">
                        <input type="text" placeholder="Address" name="Address" required>
                    </div>

                    <div class="field-group">
                        <label for="dropdown">What is your Skill? </label>
                        <select id="dropdown" name="role" required>
                            <option value="">Select a role</option>
                            <option value="1">Artist</option>
                            <option value="2">Musicians</option>
                            <option value="3">Actors</option>
                            <option value="4">Makeup Artist</option>
                            <option value="5">Fashion Designer</option>
                            <option value="6">Chef</option>
                            <option value="7">Home Designer</option>
                            <option value="8">Poet/Writer</option>
                            <option value="9">Others</option>
                        </select>
                    </div>

                    <div class="textbox">
                        <textarea name="about" placeholder="About" required></textarea>
                    </div>

                    <button type="submit" class="btn">Create Profile</button>
        
                </form>
            </div>
        </div>
    </div>
</body>
</html>
